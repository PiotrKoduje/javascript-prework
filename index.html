<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Kamień, papier, nożyce</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Kamień - papier - nożyce</h1>
      <h3 class="startGame">Zagraj</h3>
      <button class="settings-button" type="button">
        <img src="img/settings.svg" alt="settings" />
      </button>

      <div class="containerToHide">
        <div class="scoreboard">
          <div class="playerField">
            <p class="playerDescription">Ty:</p>
            <p class="playerScore">0</p>
            <p class="playerPercentage">0%</p>
          </div>
          <div class="computerField">
            <p class="computerDescription">Komputer:</p>
            <div class="computerScore">0</div>
            <p class="computerPercentage">0%</p>
          </div>
        </div>

        <div class="score">
          <div class="messages"></div>
          <div class="buttons">
            <div class="playRock choice">
              <img src="img/rock.png" alt="Kamień" />
            </div>
            <div class="playPaper choice">
              <img src="img/paper.png" alt="Papier" />
            </div>
            <div class="playScissors choice">
              <img src="img/scissors.png" alt="Nożyce" />
            </div>
            <div class="buttonsOverlay"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="settingsWindow">
      <button class="x-button" type="button">
        <img src="img/x.svg" alt="close settings window" />
      </button>
      <div class="targetScoreField">
        <p class="targetScoreDescrption">Punkty potrzebne do wygranej</p>
        <div class="stepper">
          <div class="minusButton">−</div>
          <div class="stepperValue">5</div>
          <div class="plusButton">+</div>
        </div>
      </div>
      <div class="setBiasField hidden">
        <p class="setBiasDescription">Ustaw przewagę</p>
      </div>
      <div class="setBiasTestField hidden">
        <p class="setBiasTestDescription">Wykonaj test</p>
      </div>
    </div>
    <div class="bodyOverlay">
      <p class="playAgain">Zagraj ponownie</p>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
